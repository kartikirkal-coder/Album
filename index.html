<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Factor Luxury | Album Customizer & Quotation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #121316;
    --card-bg: #1a1c22;
    --card-surface: #22252e;
    --gold: #d4af37;
    --gold-light: #f5d77f;
    --gold-dim: #997d26;
    --gold-glow: rgba(212, 175, 55, 0.18);
    --border: #2a2e39;
    --border-gold: rgba(212, 175, 55, 0.45);
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --radius: 14px;
    --shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e212b 0%, var(--bg-main) 80%);
    color: var(--text-primary);
    padding: 24px 16px 90px;
    min-height: 100vh;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 26px;
    position: relative;
  }

  .brand-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold-light);
    border: 1px solid var(--border-gold);
    background: rgba(212, 175, 55, 0.08);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #ffffff;
  }

  header p {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .admin-trigger-btn {
    position: absolute;
    right: 0;
    top: 4px;
    background: var(--card-surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    transition: all 0.2s;
  }
  .admin-trigger-btn:hover {
    border-color: var(--gold);
    box-shadow: 0 0 14px var(--gold-glow);
    transform: scale(1.05);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold-light);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-secondary);
  }

  select, input[type="number"], input[type="password"] {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #ffffff;
    background: var(--card-surface);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  select:focus, input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }
  select option, optgroup {
    background: #1a1c22;
    color: #ffffff;
  }

  .counter-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .counter-btn {
    width: 48px;
    height: 48px;
    border: 1.5px solid var(--border);
    background: var(--card-surface);
    color: var(--gold-light);
    border-radius: 10px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: all 0.2s;
  }
  .counter-btn:hover {
    border-color: var(--gold);
    background: #2a2e3a;
  }

  /* Visual Cover Showcase */
  .cover-preview-card {
    display: flex;
    gap: 16px;
    align-items: center;
    background: var(--card-surface);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 14px;
  }
  .cover-preview-thumb {
    width: 74px;
    height: 74px;
    border-radius: 8px;
    background: #111317;
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover-preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cover-preview-info h4 {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
  }
  .cover-preview-info p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.35;
  }

  .checkbox-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--card-surface);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .checkbox-pill.active {
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.08);
  }
  .checkbox-pill input { display: none; }

  /* Pricing Output Banner */
  .quote-banner {
    background: linear-gradient(145deg, #181a21 0%, #0d0e12 100%);
    border: 1.5px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--gold-glow);
    margin-bottom: 20px;
  }

  .quote-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    padding-bottom: 16px;
    margin-bottom: 16px;
  }

  .quote-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    font-weight: 700;
  }

  .total-price {
    font-size: 40px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
    margin-top: 6px;
    letter-spacing: -0.5px;
  }

  .rate-per-sheet-tag {
    background: rgba(212, 175, 55, 0.15);
    border: 1px solid var(--border-gold);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .quote-breakdown {
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 13.5px;
    color: var(--text-secondary);
  }
  .quote-breakdown-row {
    display: flex;
    justify-content: space-between;
  }

  /* Actions */
  .action-btns {
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-whatsapp {
    background: #25d366;
    color: #ffffff;
  }
  .btn-whatsapp:hover { background: #20ba59; }

  /* Admin Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8, 9, 12, 0.85);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #171920;
    border: 1px solid var(--border-gold);
    width: 100%;
    max-width: 660px;
    max-height: 90vh;
    border-radius: var(--radius);
    padding: 24px;
    overflow-y: auto;
    color: var(--text-primary);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }
  .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--gold-light); }
  .close-btn {
    background: transparent;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .admin-section {
    background: #1f222b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .admin-sec-title {
    font-size: 13px;
    font-weight: 700;
