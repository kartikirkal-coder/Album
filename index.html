<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Factor Luxury | Album Customizer & Quotation</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #121316;
    --card-bg: #1c1d22;
    --card-secondary: #23252b;
    --gold: #d4af37;
    --gold-light: #f3cf65;
    --gold-dark: #9e7d23;
    --gold-glow: rgba(212, 175, 55, 0.2);
    --border: #2e313a;
    --border-gold: rgba(212, 175, 55, 0.4);
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --radius: 14px;
    --shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2027 0%, var(--bg-dark) 75%);
    color: var(--text-primary);
    padding: 24px 16px 80px;
    min-height: 100vh;
    line-height: 1.5;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
    padding-bottom: 12px;
  }

  .brand-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold-light);
    border: 1px solid var(--border-gold);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
    background: rgba(212, 175, 55, 0.08);
  }

  header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff 40%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .admin-trigger-btn {
    position: absolute;
    right: 0;
    top: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    transition: all 0.25s ease;
  }
  .admin-trigger-btn:hover {
    border-color: var(--gold);
    background: var(--card-secondary);
    transform: rotate(45deg);
  }

  /* Cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
    position: relative;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-light);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.3px;
  }

  .card-title span.step-no {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #0e0e11;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 800;
  }

  .form-group {
    margin-bottom: 20px;
  }
  .form-group:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }

  select, input[type="number"], input[type="password"] {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #ffffff;
    background: var(--card-secondary);
    outline: none;
    transition: all 0.25s;
  }

  select:focus, input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  /* Counter Wrapper */
  .counter-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .counter-btn {
    width: 48px;
    height: 48px;
    border: 1.5px solid var(--border);
    background: var(--card-secondary);
    color: var(--gold);
    border-radius: 10px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: 0.2s;
  }
  .counter-btn:hover {
    border-color: var(--gold);
    background: #2b2e38;
  }

  /* Interactive Visual Selection Grid */
  .preview-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #17181c;
    overflow: hidden;
    margin-top: 14px;
    display: flex;
    gap: 16px;
    padding: 12px;
    align-items: center;
  }
  .preview-card img {
    width: 90px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-gold);
  }
  .preview-info {
    flex: 1;
  }
  .preview-info h4 {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold-light);
  }
  .preview-info p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .preview-price-tag {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    background: rgba(212, 175, 55, 0.1);
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-gold);
  }

  /* Flush Mount Toggle Pill */
  .checkbox-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border: 1.5px solid var(--border);
    background: var(--card-secondary);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .checkbox-pill.active {
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.08);
  }
  .checkbox-pill input { display: none; }

  /* Pricing Output Banner */
  .quote-banner {
    background: linear-gradient(145deg, #1f2127 0%, #15161a 100%);
    border: 1.5px solid var(--border-gold);
    color: #fff;
    border-radius: var(--radius);
    padding: 26px;
    box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.8), 0 0 20px var(--gold-glow);
    margin-bottom: 22px;
  }

  .quote-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    padding-bottom: 16px;
    margin-bottom: 16px;
  }

  .quote-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    font-weight: 700;
  }

  .total-price {
    font-size: 42px;
    font-weight: 800;
    color: #f7d568;
    line-height: 1.1;
    margin-top: 4px;
  }

  .rate-per-sheet-tag {
    background: rgba(212, 175, 55, 0.15);
    border: 1px solid var(--border-gold);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .quote-breakdown {
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 13.5px;
    color: var(--text-secondary);
  }
  .quote-breakdown-row {
    display: flex;
    justify-content: space-between;
  }

  /* Actions */
  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.25s;
  }
  .btn-whatsapp {
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: #fff;
    box-shadow: 0 6px 20px -4px rgba(37, 211, 102, 0.4);
  }
  .btn-whatsapp:hover {
    background: #1ebe5d;
    transform: translateY(-2px);
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 6, 8, 0.82);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #181a1f;
    border: 1px solid var(--border-gold);
    color: #fff;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    border-radius: var(--radius);
    padding: 26px;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }
  .modal-header h2 { font-size: 19px; font
